# Код и комментарии в основном на русском — кириллица занимает больше
# байт/колонок на то же количество смысла, чем латиница, поэтому строгий
# 79/88-символьный лимit ломает читаемость сильнее, чем помогает. 110 —
# практический компромисс, не блокирующий длинные, но осмысленные строки.
line-length = 110

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[lint.isort]
known-first-party = ["app"]
